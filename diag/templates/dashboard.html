<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --ink: #1c2430;
    --muted: #5c6778;
    --line: #d9e0ea;
    --bg: #f4f7fb;
    --card: #ffffff;
    --navy: #0b3a5b;
    --green: #1f7a4d;
    --green-bg: #e5f6ec;
    --amber: #8a5a00;
    --amber-bg: #fff4d6;
    --red: #a12622;
    --red-bg: #fde8e6;
    --grey: #5c6570;
    --grey-bg: #eef1f4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; justify-content: space-between; gap: 24px; align-items: flex-end; background: var(--navy); color: white; padding: 28px 32px 20px; }
  header h1 { margin: 0; font-size: 28px; }
  .eyebrow { margin: 0 0 4px; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; opacity: .8; }
  .sub, .meta, .reason, .coverage { color: var(--muted); }
  header .sub { color: rgba(255,255,255,.8); margin: 6px 0 0; }
  button { font: inherit; }
  #measured-toggle, .tab { border: 1px solid transparent; border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  #measured-toggle { background: white; color: var(--navy); }
  .tabs { display: flex; gap: 8px; padding: 16px 32px 0; }
  .tab { background: transparent; color: var(--navy); }
  .tab.active { background: var(--navy); color: white; }
  .panel { display: none; padding: 20px 32px 48px; }
  .panel.active { display: block; }
  .verdict { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 24px; }
  .verdict h2 { margin: 0; font-size: 36px; }
  .bigscore { font-size: 28px; font-weight: 700; margin: 8px 0; }
  .scale { display: flex; justify-content: space-between; gap: 8px; margin: 16px 0; padding: 10px 12px; background: white; border-radius: 10px; font-size: 13px; color: var(--muted); }
  .ready-line { color: var(--green); font-weight: 700; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 16px 0; }
  .card, .detail { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .card h3, .detail h3 { margin: 0 0 8px; font-size: 16px; }
  .findings { list-style: none; padding: 0; }
  .findings li { background: white; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: #e7eef6; font-size: 13px; }
  .pill { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
  .pill.green { color: var(--green); background: var(--green-bg); }
  .pill.amber { color: var(--amber); background: var(--amber-bg); }
  .pill.red { color: var(--red); background: var(--red-bg); }
  .pill.grey { color: var(--grey); background: var(--grey-bg); }
  .actions { padding-left: 18px; }
  .actions li, .detail { margin: 12px 0; }
  footer { padding: 8px 32px 28px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
__CONTENT__
<script id="results" type="application/json">__JSON__</script>
<script>
const tabs = document.querySelectorAll(".tab");
tabs.forEach((button) => {
  button.addEventListener("click", () => {
    tabs.forEach((item) => item.classList.remove("active"));
    document.querySelectorAll(".panel").forEach((panel) => panel.classList.remove("active"));
    button.classList.add("active");
    document.getElementById(button.dataset.tab).classList.add("active");
  });
});
let measured = false;
document.getElementById("measured-toggle").addEventListener("click", () => {
  measured = !measured;
  const toggle = document.getElementById("measured-toggle");
  toggle.setAttribute("aria-pressed", measured ? "true" : "false");
  toggle.textContent = measured ? "Showing measured evidence" : "Measured evidence only";
  document.querySelectorAll("[data-full]").forEach((node) => {
    if (node.classList.contains("pill")) {
      const status = measured ? node.dataset.measured : node.dataset.full;
      node.textContent = status;
      const tone = measured ? node.dataset.measuredClass : node.dataset.fullClass;
      node.className = "pill " + (tone || "grey");
      return;
    }
    node.textContent = measured ? node.dataset.measured : node.dataset.full;
  });
});
</script>
</body>
</html>
