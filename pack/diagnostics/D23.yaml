id: D23
name: Accuracy metrics
area: Validation & backtesting
tier: core
points: 3
gate: false
question: "Is forecast error measured with a standard metric at the horizons the business uses?"
applies_to: [ml, statistical, intermittent, baseline, unknown]
data_route:
  requires: [sales_history, past_forecasts]
  measures:
    - name: wape
      critical: true
      curve:
        - {x: 0.0, y: 100}
        - {x: 0.10, y: 85}
        - {x: 0.20, y: 70}
        - {x: 0.35, y: 45}
        - {x: 0.50, y: 25}
        - {x: 1.0, y: 0}
    - name: abs_bias
      critical: false
      curve:
        - {x: 0.0, y: 100}
        - {x: 0.05, y: 80}
        - {x: 0.15, y: 55}
        - {x: 0.30, y: 30}
        - {x: 1.0, y: 0}
signals:
  metrics_in_config:
    polarity: positive
    owner: D23
    detectors:
      - type: config_key
        file_family: config
        level: Verified
        params:
          key_globs: ["metrics.*", "accuracy.*", "backtest.metric*"]
          value_terms: ["@metrics"]
    review: none
  metrics_in_docs:
    polarity: positive
    owner: D23
    detectors:
      - type: phrase_search
        file_family: document
        level: Attested
        params:
          phrases: ["@metrics"]
    review: none
scoring:
  - {when_any: [metrics_in_config, metrics_in_docs], score: 60}
  - {otherwise: no_evidence}
checks:
  - id: wape
    name: WAPE
    measure: wape
    when_measured: "WAPE on the aligned history and forecast archive is {wape_pct}. This is total absolute error divided by total actuals."
    when_missing: "WAPE was not computed. It needs both a sales history and a past-forecast archive with series, run date, target date, and forecast."
  - id: bias
    name: Absolute bias
    measure: abs_bias
    when_measured: "Absolute bias is {abs_bias_pct} of actuals. This is the size of the net over- or under-forecast, not the direction."
    when_missing: "Absolute bias was not computed. It uses the same history and forecast archive as WAPE."
  - id: metric_config
    name: Metric named in configuration
    signal: metrics_in_config
    when_found: "The forecast configuration names a recognised accuracy metric. {fact}"
    when_missing: "No recognised metric name was found under the metrics, accuracy, or backtest keys."
  - id: metric_document
    name: Metric named in a document
    signal: metrics_in_docs
    when_found: "A document or transcript names a recognised accuracy metric. {fact}"
    when_missing: "No recognised metric name was found in the documents or transcripts."
recommendations:
  wape: R-VAL-01
  abs_bias: R-VAL-01
  metrics_in_config: R-VAL-01
  metrics_in_docs: R-VAL-01
gap_request: "Past forecasts (series, run date, target date, forecast) joined to actuals, or a metric definition from the config."
review_checklist:
  - "Is the reported metric the one the business uses to judge the forecast, at the horizons they use?"
  - "Does the published number match the WAPE computed here from the archive?"
version_notes: "0.2.0: WAPE, bias, and where the metric is named are reported as separate checks."
