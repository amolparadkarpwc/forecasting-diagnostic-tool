# ---------------------------------------------------------------------------
# Targeted request and practitioner review
# ---------------------------------------------------------------------------
gap_request:
  condition: >-
    A raw extract of sales history straight from the source system: at least 2 years, all series or a
    stated random sample, with the total number of series, and how zero-sale periods are recorded
    (zero rows or no rows). Master data for the same series.
  control: >-
    The code or SQL that loads and prepares the data (prep scripts, SQL extracts, dbt models), any
    validation configuration (expectation suites, schema files, dbt tests), and the last 3 months of
    pipeline logs.

review_checklist:
  - "When nothing sells, does the source write a zero row or no row at all? (decides every zero-fill signal)"
  - "Is the shared prep code the version that runs in production?"
  - "Do validation failures stop the run, or only log a warning?"
  - "When the source schema changes, who is told, and how?"
  - "Are negative values returns? If so, where are returns recorded?"
  - "Was the extract a random sample or chosen by the client? How many series exist in total?"
  - "Do any data checks run outside the shared code, e.g. in the warehouse or the orchestration tool?"

tests: "README.md, section 6 (planted cases D1-D22, Z1-Z9, S1-S4)"
